pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'org.jetbrains.kotlin.plugin.serialization' version "2.2.20"
        id 'org.jetbrains.kotlin.plugin.compose' version "2.2.20"
        id 'com.android.application' version '8.13.0'
        id 'com.android.library' version '8.13.0'
        id 'org.jetbrains.kotlin.android' version '2.2.20'
    }
}

rootProject.name = "IonicPortals"
include ':IonicPortals'
include ':TestApp'
include ':TestAppCompose'

// Local dev: build io.ionic:liveupdateprovider from source against the sibling
// live-update-provider-sdk checkout instead of Maven Central, so we can work
// against its unreleased API. Remove once a matching release is published.
def liveUpdateProviderSdkDir = new File(rootDir, '../live-update-provider-sdk/android')
if (liveUpdateProviderSdkDir.exists()) {
    includeBuild(liveUpdateProviderSdkDir) {
        dependencySubstitution {
            substitute module('io.ionic:liveupdateprovider') using project(':live-update-provider')
        }
    }
}
